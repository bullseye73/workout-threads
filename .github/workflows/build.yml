# 3개 OS에서 테스트하고 설치 파일(서명 없음)을 만든다.
# 실제 운동 샘플(GPS 포함)은 저장소에 없으므로 그 테스트는 건너뛴다.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 빌드 도구
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libdbus-1-dev pkg-config build-essential file

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 화면 의존성
        run: npm ci --prefix ui

      - name: Rust 테스트 (샘플 없으면 건너뜀)
        run: cargo test --workspace
        env:
          WORKOUT_SAMPLES: ${{ github.workspace }}/no-samples

      - name: 화면 테스트
        run: npm --prefix ui test

      - name: 설치 파일 만들기
        uses: tauri-apps/tauri-action@v0
        with:
          # 로컬과 같게 src-tauri에서 실행해야 beforeBuildCommand(npm --prefix ui …)가 맞는 폴더를 찾는다.
          projectPath: src-tauri
          tauriScript: npx --prefix ../ui tauri

      - uses: actions/upload-artifact@v4
        with:
          name: workout-app-${{ matrix.platform }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: warn
