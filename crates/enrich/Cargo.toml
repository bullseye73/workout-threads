[package]
name = "workout-enrich"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
workout-core = { version = "0.1.0", path = "../core" }
workout-post = { version = "0.1.0", path = "../post" }

[features]
mock = []

[dev-dependencies]
workout-enrich = { path = ".", features = ["mock"] }
